server:
  port: 9010
spring:
  application:
    name: "AUTENTICACION"
  devtools:
    add-properties: false
  h2:
    console:
      enabled: true
      path: "/h2"
  profiles:
    include: null
adapters:
  r2dbc:
    host: "localhost"
    database: "crediya_auth"
    port: 3307
    password: "root"
    username: "root"
springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-doc
  webjars:
    prefix: /webjars/swagger-ui
routes:
  base-v1: /api/v1
  login: /login
  user: /usuarios
management:
  endpoints:
    web:
      exposure:
        include: "health,prometheus"
  endpoint:
    health:
      probes:
        enabled: true
cors:
  allowed-origins: "http://localhost:4200,http://localhost:9010"

